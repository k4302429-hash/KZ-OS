<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101a35">
<title>KZ OS — Preview interativo</title>
<style>
:root{font-family:Inter,Segoe UI,system-ui,sans-serif;color:#f5f7fc}*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow:hidden;background:linear-gradient(125deg,#101a35,#254f78 55%,#16233f);transition:background .3s}.desktop{height:100vh;padding:18px 16px 76px;position:relative}.icons{display:grid;grid-template-columns:repeat(2,86px);gap:10px;width:max-content}.desk-icon{border:0;color:white;background:transparent;border-radius:12px;padding:12px 6px;cursor:pointer;text-align:center}.desk-icon:hover{background:#ffffff22}.desk-icon span{display:block;font-size:28px;margin-bottom:5px}.desk-icon small{font-size:11px}.taskbar{position:absolute;bottom:0;left:0;right:0;height:62px;background:#1a2539d9;backdrop-filter:blur(20px);display:flex;align-items:center;justify-content:center;gap:6px;border-top:1px solid #ffffff22}.taskbar button,.start-app{border:0;background:transparent;color:inherit;border-radius:12px;padding:10px;cursor:pointer}.taskbar button:hover,.start-app:hover{background:#ffffff20}.start-button{background:#3b82f6!important;font-weight:800}.clock{position:absolute;right:16px;text-align:right;font-size:12px}.window{position:absolute;left:12%;top:12%;width:min(560px,calc(100vw - 24px));height:min(440px,calc(100vh - 110px));background:#f7f9fdeb;color:#182235;border:1px solid #ffffffaa;border-radius:18px;box-shadow:0 20px 70px #0006;overflow:hidden;resize:both;min-width:290px;min-height:220px}.titlebar{height:48px;display:flex;align-items:center;padding:0 8px 0 15px;background:#e9eef6;cursor:grab;user-select:none;gap:8px}.titlebar strong{flex:1}.controls{display:flex;gap:3px}.controls button{border:0;background:transparent;border-radius:8px;padding:8px;cursor:pointer}.controls button:hover{background:#d7deea}.content{height:calc(100% - 48px);overflow:auto;padding:16px}.start-menu{position:absolute;bottom:72px;left:50%;transform:translateX(-50%);width:min(420px,94vw);padding:20px;background:#1c2940f2;backdrop-filter:blur(20px);border:1px solid #ffffff28;border-radius:22px;box-shadow:0 18px 60px #0006;display:none}.start-menu.open{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:4px}.start-app{text-align:left}.muted{color:#667085;font-size:13px}.row{display:flex;align-items:center;gap:10px}.row>*:first-child{flex:1}button,input,textarea{font:inherit}input,textarea{border:1px solid #ccd4e0;border-radius:9px;padding:10px;background:white;color:#182235}textarea{width:100%;height:calc(100% - 25px);resize:none}.btn{border:0;border-radius:9px;background:#3b82f6;color:white;padding:9px 12px;cursor:pointer}.file{padding:10px;border-bottom:1px solid #e6eaf0;display:flex;align-items:center;gap:8px}.file span{flex:1}.calc-display{font-size:27px;text-align:right;padding:8px;min-height:46px}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.keys button{padding:13px;border:0;border-radius:10px;background:#e5eaf2;cursor:pointer}.keys button:hover{background:#d3dceb}.wall{width:52px;height:40px;border:0;border-radius:9px;cursor:pointer;margin:4px}.toast{position:absolute;left:50%;bottom:78px;transform:translateX(-50%);padding:10px 16px;background:#101a35e8;border-radius:12px;display:none}
body.light{color:#182235;background:linear-gradient(125deg,#8cc7e8,#daeaf4 55%,#779ec1)}body.light .taskbar{background:#f4f8fce8}.mobile-note{position:absolute;right:16px;top:15px;color:#ffffff99;font-size:11px}
</style>
</head>
<body><main class="desktop" id="desktop"><div class="mobile-note">Preview interativo • protótipo web</div><div class="icons" id="icons"></div><nav class="taskbar"><button class="start-button" onclick="toggleStart()">KZ</button><button onclick="openApp('files')">📁</button><button onclick="openApp('notes')">📝</button><button onclick="openApp('calc')">🧮</button><button onclick="openApp('settings')">⚙️</button><button onclick="openApp('computer')">💻</button><div class="clock"><div id="time"></div><div id="date"></div></div></nav><section class="start-menu" id="start"><h2 style="margin:0 0 8px">KZ OS</h2><p class="muted" style="color:#b8c5d8">Seus aplicativos</p><div class="grid" id="startGrid"></div></section><div class="toast" id="toast"></div></main>
<script>
const apps={computer:['💻','Meu Computador'],files:['📁','Arquivos'],notes:['📝','Bloco de notas'],calc:['🧮','Calculadora'],settings:['⚙️','Configurações'],terminal:['⌨️','Terminal'],tasks:['📊','Desempenho'],browser:['🌐','Navegador']};let z=2,win=0,expr='';let data=JSON.parse(localStorage.kzFiles||'{}');
function buildIcons(){let picks=['computer','files','notes','calc'];icons.innerHTML=picks.map(k=>`<button class="desk-icon" onclick="openApp('${k}')"><span>${apps[k][0]}</span><small>${apps[k][1]}</small></button>`).join('');startGrid.innerHTML=Object.keys(apps).map(k=>`<button class="start-app" onclick="openApp('${k}');toggleStart()">${apps[k][0]}　${apps[k][1]}</button>`).join('')}
function toggleStart(){start.classList.toggle('open')}
function openApp(k){let id='w'+(++win);let el=document.createElement('section');el.className='window';el.id=id;el.style.zIndex=++z;el.innerHTML=`<header class="titlebar" onpointerdown="drag(event,'${id}')"><span>${apps[k][0]}</span><strong>${apps[k][1]}</strong><div class="controls"><button onclick="minimize('${id}')" title="Minimizar">—</button><button onclick="maximize('${id}')" title="Maximizar">□</button><button onclick="closeWin('${id}')" title="Fechar">✕</button></div></header><div class="content">${content(k)}</div>`;desktop.appendChild(el);el.onpointerdown=()=>el.style.zIndex=++z}
function closeWin(id){document.getElementById(id)?.remove()}function minimize(id){document.getElementById(id).style.display='none';toast('Janela minimizada. Abra novamente pelo menu Iniciar.')}
function maximize(id){let e=document.getElementById(id);e.classList.toggle('max');if(e.classList.contains('max')){e.dataset.old=`${e.style.left}|${e.style.top}|${e.style.width}|${e.style.height}`;Object.assign(e.style,{left:'8px',top:'8px',width:'calc(100vw - 16px)',height:'calc(100vh - 84px)'})}else{let a=e.dataset.old.split('|');[e.style.left,e.style.top,e.style.width,e.style.height]=a}}
function drag(ev,id){if(ev.target.closest('button'))return;let e=document.getElementById(id),r=e.getBoundingClientRect(),sx=ev.clientX,sy=ev.clientY;function move(e2){e.style.left=Math.max(0,r.left+e2.clientX-sx)+'px';e.style.top=Math.max(0,r.top+e2.clientY-sy)+'px'}function end(){window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',end)}window.addEventListener('pointermove',move);window.addEventListener('pointerup',end)}
function content(k){if(k==='notes')return `<p class="muted">Notas salvas neste navegador.</p><textarea id="notes" placeholder="Comece a escrever…" oninput="localStorage.kzNotes=this.value"></textarea><script>document.getElementById('notes').value=localStorage.kzNotes||''<\/script>`;
if(k==='calc')return `<div class="calc-display" id="display">0</div><div class="keys">${['7','8','9','÷','4','5','6','×','1','2','3','−','C','0','.','+','(',')','⌫','='].map(x=>`<button onclick="key('${x}')">${x}</button>`).join('')}</div>`;
if(k==='files')return `<div class="row"><input id="filename" placeholder="Nome de arquivo"><button class="btn" onclick="newFile()">Criar arquivo</button><button class="btn" onclick="newFolder()">Pasta</button></div><p class="muted">Itens salvos localmente neste navegador.</p><div id="filelist"></div><script>renderFiles()<\/script>`;
if(k==='settings')return `<h3>Aparência</h3><button class="btn" onclick="document.body.classList.toggle('light');localStorage.kzLight=document.body.classList.contains('light')">Alternar tema claro/escuro</button><h3>Papel de parede</h3><button class="wall" style="background:linear-gradient(135deg,#101a35,#254f78)" onclick="wall(0)"></button><button class="wall" style="background:linear-gradient(135deg,#30234f,#8c4b78)" onclick="wall(1)"></button><button class="wall" style="background:linear-gradient(135deg,#174a46,#4f9b8b)" onclick="wall(2)"></button><p class="muted">Preferências guardadas no navegador.</p>`;
if(k==='computer')return `<h2>Este dispositivo</h2><p>KZ OS Preview • ambiente desktop demonstrativo</p><p>Navegador: ${navigator.userAgent.slice(0,100)}</p><p>CPU lógica (informação do navegador): ${navigator.hardwareConcurrency||'indisponível'}</p><p class="muted">Não é virtualização: esta prévia funciona como protótipo web.</p>`;
if(k==='tasks')return `<h2>Monitor do sistema</h2><p>Janelas abertas: ${document.querySelectorAll('.window').length}</p><p>Memória da página: métrica não disponível neste navegador.</p><p class="muted">CPU/GPU/RAM virtuais não são implementadas nesta prévia.</p>`;
if(k==='terminal')return `<div style="font-family:monospace;background:#10151d;color:#b6f2c2;padding:14px;min-height:250px"><div id="termout">KZ Terminal Preview<br>Comandos: help, ls, pwd, clear, date</div><div class="row"><span>kz&gt;</span><input id="cmd" onkeydown="if(event.key==='Enter')runCmd()" style="background:#192331;color:white;border-color:#344"></div></div>`;
return `<h3>Navegador</h3><p>Este protótipo não carrega sites externos. Abra endereço em nova aba:</p><div class="row"><input id="address" placeholder="https://example.com"><button class="btn" onclick="browse()">Abrir</button></div><p class="muted">A navegação online depende da conexão e abre fora do protótipo.</p>`}
function key(k){if(k==='C')expr='';else if(k==='⌫')expr=expr.slice(0,-1);else if(k==='='){try{let s=expr.replaceAll('÷','/').replaceAll('×','*').replaceAll('−','-');if(!/^[0-9+*/(). -]+$/.test(s))throw 0;expr=String(Function('return ('+s+')')())}catch{expr='Erro'}}else expr+=k;let d=document.getElementById('display');if(d)d.textContent=expr||'0'}
function save(){localStorage.kzFiles=JSON.stringify(data)}function newFile(){let n=document.getElementById('filename').value.trim();if(!n)return toast('Digite um nome');data[n]={type:'Arquivo',text:''};save();renderFiles()}function newFolder(){let n=document.getElementById('filename').value.trim();if(!n)return toast('Digite um nome');data[n]={type:'Pasta',text:''};save();renderFiles()}function renderFiles(){let l=document.getElementById('filelist');if(!l)return;l.innerHTML=Object.keys(data).map(n=>`<div class="file">${data[n].type==='Pasta'?'📁':'📄'}<span>${n}</span><button onclick="renameFile('${encodeURIComponent(n)}')">Renomear</button><button onclick="deleteFile('${encodeURIComponent(n)}')">Excluir</button></div>`).join('')||'<p class="muted">Nenhum item ainda.</p>'}function deleteFile(n){delete data[decodeURIComponent(n)];save();renderFiles()}function renameFile(n){n=decodeURIComponent(n);let nn=prompt('Novo nome:',n);if(nn&&nn!==n){data[nn]=data[n];delete data[n];save();renderFiles()}}
function wall(n){let b=[['#101a35','#254f78','#16233f'],['#30234f','#8c4b78','#242044'],['#174a46','#4f9b8b','#18304b']][n];document.body.style.background=`linear-gradient(125deg,${b.join(',')})`;localStorage.kzWall=n}function browse(){let u=document.getElementById('address').value;if(u){if(!/^https?:/i.test(u))u='https://'+u;window.open(u,'_blank','noopener')}}function runCmd(){let i=document.getElementById('cmd'),o=document.getElementById('termout'),c=i.value;let r=c==='help'?'help ls pwd clear date':c==='ls'?Object.keys(data).join(' ')||'(vazio)':c==='pwd'?'/KZ-OS':c==='date'?new Date().toString():c==='clear'?'':`Comando não encontrado: ${c}`;o.innerHTML+=`<br>kz&gt; ${c}<br>${r}`;i.value='';if(c==='clear')o.innerHTML=''}function toast(t){let e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',1800)}
function tick(){let d=new Date();time.textContent=d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});date.textContent=d.toLocaleDateString('pt-BR')}buildIcons();tick();setInterval(tick,15000);if(localStorage.kzLight==='true')document.body.classList.add('light');if(localStorage.kzWall)wall(+localStorage.kzWall);
</script></body></html>
